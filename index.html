
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuplo</title>
<style>
* {box-sizing:border-box}
body {
 margin:0;
 font-family:Arial,sans-serif;
 background:#17172b;
 color:white;
}
.container {
 max-width:420px;
 margin:auto;
 padding:35px 24px;
}
.logo {
 width:75px;height:75px;
 background:linear-gradient(135deg,#a855f7,#6d28d9);
 border-radius:23px;
 display:grid;
 place-items:center;
 font-size:42px;
 font-weight:bold;
 margin:35px auto 12px;
}
.brand {
 text-align:center;
 font-size:34px;
 font-weight:bold;
}
.tagline {
 text-align:center;
 color:#c4b5fd;
 margin-top:8px;
}
.card {
 background:white;
 color:#222;
 padding:25px;
 border-radius:20px;
 margin-top:35px;
}
h2 {margin-top:0}
input {
 width:100%;
 padding:15px;
 margin:9px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:15px;
}
.mainbtn {
 width:100%;
 padding:15px;
 background:#8538dc;
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 margin-top:15px;
}
.switch {
 text-align:center;
 color:#7433bd;
 margin-top:20px;
}
.switch span {font-weight:bold}
.hidden {display:none}
.note {
 color:#888;
 font-size:12px;
 text-align:center;
 margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">Z</div>
<div class="brand">ZUPLO</div>
<div class="tagline">Connect. Share. Explore.</div>

<div class="card" id="login">
<h2>Welcome Back 👋</h2>
<p>Login to your account</p>

<input type="email" id="loginEmail"
placeholder="Email address">

<input type="password" id="loginPass"
placeholder="Password">

<button class="mainbtn" onclick="loginUser()">
Login
</button>

<div class="switch" onclick="showSignup()">
Don't have an account? <span>Sign Up</span>
</div>
</div>

<div class="card hidden" id="signup">
<h2>Create Account ❤️</h2>
<p>Join the Zuplo community</p>

<input id="name" placeholder="Your name">

<input type="email" id="email"
placeholder="Email address">

<input type="password" id="pass"
placeholder="Create password">

<button class="mainbtn" onclick="signupUser()">
Create Account
</button>

<div class="switch" onclick="showLogin()">
Already have an account? <span>Login</span>
</div>
</div>

<div class="note">
Welcome to the world of Zuplo!
</div>

</div>


<script type="module">
    // SWITCH BETWEEN LOGIN AND SIGNUP
window.showSignup = function() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("signup").classList.remove("hidden");
};

window.showLogin = function() {
  document.getElementById("signup").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCWS7256FlWwEHpFd3RwbrkmzFdmve_NgI",
  authDomain: "zuplo-e5c34.firebaseapp.com",
  projectId: "zuplo-e5c34",
  storageBucket: "zuplo-e5c34.firebasestorage.app",
  messagingSenderId: "57662080818",
  appId: "1:57662080818:web:fb9febb262851b1b5a392b",
  measurementId: "G-VPT197RTEH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGNUP
window.signupUser = async function() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;

  if (!name || !email || !pass) {
    alert("Please fill all details");
    return;
  }

  if (pass.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, pass
    );

    await updateProfile(result.user, {
      displayName: name
    });

    alert("Welcome to Zuplo! Account created successfully.");

  } catch (error) {
    alert(error.message);
  }
};

// LOGIN
window.loginUser = async function() {
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;

  if (!email || !pass) {
    alert("Please enter email and password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    alert("Welcome back to Zuplo!");

  } catch (error) {
    alert(error.message);
  }
};
</script>


</body>
</html>
